# Local infrastructure and the full application stack in containers.
#
#   docker compose up -d postgres-test            # disposable DB for pytest (H0-A)
#   docker compose --profile app up --build       # migrate -> backend -> agent -> frontend
#   docker compose --profile app down
#
# The `app` profile reads the root .env (same file the three-terminal
# workflow in docs/LOCAL_DEMO_SETUP.md uses). Only the values that differ
# inside the compose network are overridden below. Ports match local dev:
# backend 8001, frontend 5174. docs/production-hardening-plan.md H0-D.

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_interview
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Throwaway database for the test suites. No volume: `docker compose down`
  # (or a restart with tmpfs) wipes it, and conftest.py drops and recreates
  # the `public` schema at the start of every pytest session anyway. Port
  # 5433 so it never collides with a real local Postgres on 5432.
  postgres-test:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: himma_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d himma_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  # One-shot: applies the Alembic chain to DATABASE_URL, then exits. The
  # backend waits for it to finish successfully before starting, so the
  # `alembic upgrade head` in backend/Dockerfile's CMD is a no-op here.
  migrate:
    profiles: ["app"]
    build: ./backend
    env_file: .env
    command: ["alembic", "upgrade", "head"]

  backend:
    profiles: ["app"]
    build: ./backend
    env_file: .env
    environment:
      PORT: "8001"
      LOG_FORMAT: json
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=3).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  agent:
    profiles: ["app"]
    build: ./agent
    env_file: .env
    environment:
      # Inside the compose network the backend is a service name, not localhost.
      BACKEND_INTERNAL_URL: http://backend:8001
      # Key-rotation state + TTS cache on a volume, not in the image's /app.
      AGENT_STATE_DIR: /var/lib/himma-agent
      LOG_FORMAT: json
    volumes:
      - agent_state:/var/lib/himma-agent
    command: ["python", "-m", "agent.main", "dev"]
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    image: node:22-alpine
    working_dir: /app
    env_file: frontend/.env
    environment:
      # The responsive harness (puppeteer) runs on the host, not in here.
      PUPPETEER_SKIP_DOWNLOAD: "1"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    # Install only when the node_modules volume is empty; `npm ci` wipes and
    # re-downloads everything otherwise.
    command: ["sh", "-c", "[ -f node_modules/.package-lock.json ] || npm ci --no-audit --no-fund; npm run dev -- --host 0.0.0.0 --port 5174"]
    restart: on-failure
    ports:
      - "5174:5174"

volumes:
  postgres_data:
  frontend_node_modules:
  agent_state:
