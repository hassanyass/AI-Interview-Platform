services:
  - type: web
    name: ai-interview-backend
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    preDeployCommand: alembic upgrade head
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: AGENT_API_SECRET
        sync: false

  - type: worker
    name: ai-interview-agent
    env: docker
    rootDir: agent
    dockerfilePath: Dockerfile
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: BACKEND_INTERNAL_URL
        fromService:
          type: web
          name: ai-interview-backend
          property: url
      - key: AGENT_API_SECRET
        sync: false
