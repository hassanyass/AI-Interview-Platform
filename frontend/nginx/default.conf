# Serving the built browser app (H6-A).
#
# Two things here are not boilerplate and should not be "tidied away":
#
# 1. The SPA fallback. Every route in this app is client-side, so a deep
#    link or a refresh must be answered with index.html.
# 2. `include security-headers.conf` in *every* location. nginx replaces
#    rather than merges `add_header`, so a location that sets its own
#    Cache-Control silently drops the server-level security headers. The
#    first version of this file did exactly that.
#
# Deliberately absent: a `types { }` block. Redefining types replaces the
# whole map from the base image's mime.types, which turned index.html into
# application/octet-stream. nginx has shipped `application/wasm wasm` since
# 1.21 and MediaPipe will not instantiate without it -- both are asserted
# by the checks in docs/handover/deploy.md rather than re-declared here.

server {
    # Above 1024 so nginx can run as an unprivileged user.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the version to anyone probing.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # What the container's own healthcheck and an orchestrator probe hit.
    # Not the backend's /ready -- this only says nginx is serving.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Written at start-up from the environment (docker-entrypoint.sh). Never
    # cached: it is the one file that differs between deployments of an
    # otherwise identical image.
    location = /config.js {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # Content-hashed by the bundler, so they can be cached hard.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
    }

    # The model and the WASM runtime are large and versioned by path.
    location /mediapipe/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public" always;
        expires 30d;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        # index.html must not be cached, or a deploy leaves browsers asking
        # for asset filenames that no longer exist.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
