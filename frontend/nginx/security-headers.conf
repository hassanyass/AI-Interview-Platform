# Security headers, in a file because nginx does not merge them.
#
# `add_header` is replace-not-append across levels: a `location` block that
# sets any header of its own discards every `add_header` from the server
# block. The first version of this config set these once at server level
# and they silently vanished from every response, because each location
# sets its own Cache-Control. So they are included per location instead --
# verified by curling each one, not by reading the config.
#
# Kept deliberately small: a header that breaks the interview is worse than
# one that is missing, and each was chosen against what this app does.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The app needs the camera and microphone; nothing else.
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;
# connect-src covers the backend API, Supabase (auth + CV storage) and
# LiveKit signalling (wss) -- the interview does not connect without them.
# `blob:` and `wasm-unsafe-eval` are what MediaPipe needs to instantiate
# its WASM worker. Narrow `https: wss:` to your own hosts once they are
# fixed; see docs/handover/deploy.md.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# HSTS is the ingress's call, not this container's: it depends on whether
# TLS terminates here or in front, and it is hard to undo in a browser.
